name: criptoanalytics-proyectosello

# Secretos y puertos se leen de variables (archivo .env, NO versionado; ver .env.example).
# Si la variable no existe se usa el valor por defecto de desarrollo: ${VAR:-valor}.
# Todos los puertos publicados escuchan solo en 127.0.0.1 (riesgo aceptado: sin autenticacion en Kafka).

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: criptobd-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-49092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      # Listo = el broker responde a una peticion real, no solo que el proceso arranco
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: criptobd-kafka-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_UI_HOST_PORT:-48085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: criptoanalytics
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  bridge-binance:
    build: ./bridge
    container_name: criptobd-bridge-binance
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC: "${KAFKA_TOPIC:-binance-btc-trades}"
    depends_on:
      kafka:
        condition: service_healthy

  consumer-crypto:
    build: ./consumer
    container_name: criptobd-consumer
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC: "${KAFKA_TOPIC:-binance-btc-trades}"
      KAFKA_GROUP_ID: "criptoanalytics-consumer-group"
    depends_on:
      kafka:
        condition: service_healthy
      bridge-binance:
        condition: service_started

  pyspark-jupyter:
    build: ./pyspark
    container_name: criptobd-pyspark-jupyter
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JUPYTER_HOST_PORT:-8888}:8888"
      - "127.0.0.1:4040-4043:4040-4043"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: "${JUPYTER_TOKEN:-criptoanalytics}"
      SPARK_DRIVER_MEMORY: "${SPARK_DRIVER_MEMORY:-2g}"
      # El notebook de hardening (U3) lee este archivo: no hace falta copiarlo a notebooks/
      COMPOSE_PATH: /home/jovyan/compose.yml
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./compose.yml:/home/jovyan/compose.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/api > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: criptobd-kafka-exporter
    restart: unless-stopped
    command:
      - "--kafka.server=kafka:9092"
    ports:
      - "127.0.0.1:${KAFKA_EXPORTER_HOST_PORT:-9308}:9308"
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: criptobd-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-49090}:9090"
    volumes:
      - ./obs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      kafka-exporter:
        condition: service_started
      pushgateway:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    container_name: criptobd-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-43000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
    volumes:
      - ./obs/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy

  pushgateway:
    image: prom/pushgateway:v1.11.1
    container_name: criptobd-pushgateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PUSHGATEWAY_HOST_PORT:-49091}:9091"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9091/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
